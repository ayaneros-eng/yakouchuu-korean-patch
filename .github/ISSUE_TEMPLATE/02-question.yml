name: "기타 문의"
description: "패치 설치 질문, 의견, 건의 등을 남겨주세요."
title: "[문의] "
labels:
  - "question"
body:
  - type: markdown
    attributes:
      value: |
        설치 질문, 의견, 건의는 이 양식으로 남겨주세요.
        실제 오류는 **한글패치 오류 제보** 양식을 이용하면 더 빠르게 확인할 수 있습니다.
        [기존 Issues](https://github.com/ayaneros-eng/yakouchuu-korean-patch/issues)에 같은 질문이 있는지도 가볍게 확인해 주세요.
        원본 게임 데이터나 ROM·ISO·NSP·XCI 파일의 제공 요청·첨부는 하지 말아 주세요.
  - type: dropdown
    id: question-kind
    attributes:
      label: "문의 종류"
      options:
        - "설치 / 패치 적용 질문"
        - "의견 / 건의"
        - "기타"
    validations:
      required: true
  - type: input
    id: patch-version
    attributes:
      label: "한글패치 버전 / 실행 환경 (선택)"
      placeholder: "예: v2026.10.01, 에뮬레이터 이름과 버전"
  - type: textarea
    id: question
    attributes:
      label: "문의 내용"
      description: "궁금한 점이나 제안을 편하게 적어 주세요. 설치 질문이라면 어느 단계에서 막혔는지도 알려주세요."
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: "스크린샷 / 추가 정보 (선택)"
      description: "필요하면 이 칸에 스크린샷을 드래그하거나 붙여넣으세요. 원본 게임 데이터나 ROM 파일은 첨부하지 마세요."
